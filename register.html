<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | Code Artistic</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="simple-header"><nav class="navbar"><a class="logo" href="index.html">Code Artistic</a><div class="menu"><a href="index.html">Home</a><a href="hill-station.html">Hill Station</a><a href="explore.html">Explore</a><a href="contact.html">Contect</a></div><a class="register active-register" href="register.html">Register</a></nav></header>
<main class="form-section"><p class="eyebrow">JOIN THE JOURNEY</p><h1>Create Your Account</h1><p class="intro">Register to stay inspired for your next adventure.</p>
<form class="site-form" onsubmit="event.preventDefault(); document.getElementById('register-message').textContent='Registration demo submitted. Connect a backend to save accounts securely.';">
<label for="fullname">Full Name</label><input id="fullname" name="fullname" type="text" placeholder="Enter your full name" required>
<label for="reg-email">Email Address</label><input id="reg-email" name="email" type="email" placeholder="Enter your email" required>
<label for="password">Password</label><input id="password" name="password" type="password" minlength="8" placeholder="At least 8 characters" required>
<label for="confirm-password">Confirm Password</label><input id="confirm-password" name="confirm-password" type="password" minlength="8" placeholder="Re-enter your password" required>
<button class="btn" type="submit">Create Account</button><p id="register-message" class="form-message" aria-live="polite"></p>
</form><p class="note">This is a front-end demo. It does not save user accounts yet.</p></main><footer><p>© 2026 Code Artistic. All rights reserved.</p></footer>
<script>
document.querySelector('form').addEventListener('submit', function(e) {
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirm-password').value;
  if (password !== confirmPassword) { e.preventDefault(); document.getElementById('register-message').textContent = 'Passwords do not match.'; }
});
</script></body></html>
